<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VocalCoach: Product findings</title>
<style>
:root{color-scheme:light;--blue:#153FE0;--red:#DE2424;--yellow:#FFE600;--green:#08783E;--white:#FFFFFF;--background:var(--white);--foreground:var(--blue);--muted:var(--blue);--card:var(--white);--border:var(--blue);--primary:var(--blue);--accent:var(--yellow);--success:var(--green);--destructive:var(--red);--radius:16px;--font-sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}html,body{background:transparent}.deck{width:100%;max-width:1360px;margin:auto}.slide{display:none;background:var(--card);border-radius:var(--radius);padding:52px 56px 36px;min-height:650px}.slide.active{display:flex;flex-direction:column}.composition{display:flex;flex:1;align-items:center}.main{min-width:0;width:100%}h1,h2,p{margin:0}h1,h2{font-size:57px;letter-spacing:-.055em;line-height:1.08;font-weight:550;max-width:740px}.list{margin-top:35px;display:grid;gap:22px}.item{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:baseline}.num{font-size:12px;color:var(--primary);font-variant-numeric:tabular-nums}.item strong{font-weight:550;font-size:24px;letter-spacing:-.025em}.tabs{font-size:28px;letter-spacing:-.03em;line-height:1.9;margin-top:28px}.tabs span{display:inline-block;margin-right:24px}.controls{display:flex;justify-content:space-between;align-items:center;padding:16px 2px;font-size:12px;color:var(--muted);gap:12px}button{font:inherit;font-size:52px;line-height:1;background:transparent;color:var(--blue);border:0;border-radius:0;min-width:68px;min-height:68px;cursor:pointer;padding:0}button:disabled{cursor:default}button:hover:enabled{color:var(--red)}button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}

@media(min-width:1100px){.slide{min-height:720px;padding:56px 64px 38px}h1,h2{font-size:68px}}
@media(max-width:800px){.slide{padding:30px;min-height:540px}h1,h2{font-size:43px}.item strong{font-size:21px}.tabs{font-size:24px}}
@media(max-width:540px){.slide{padding:27px 24px;min-height:640px}h1,h2{font-size:41px;max-width:330px}.controls{padding:12px 0}.tabs{font-size:23px}.list{gap:16px;margin-top:24px}}
@media print{@page{size:landscape;margin:0}html,body{margin:0;padding:0}.deck{max-width:none}.slide,.slide.active{display:flex;flex-direction:column;break-after:page;border-radius:0;width:100%;height:190mm;min-height:0;padding:14mm 16mm}.slide:last-of-type{break-after:auto}.controls{display:none}h1,h2{font-size:52px}}

/* Blue and white anchor the deck. Yellow marks navigation, green review, red the alarm constraint. */
.slide:nth-of-type(1){background:var(--blue);color:var(--white)}
.slide:nth-of-type(2){background:var(--white);color:var(--blue)}
.slide:nth-of-type(2) .num{color:var(--red)}
.slide:nth-of-type(2) .item:last-child .num,.slide:nth-of-type(2) .item:last-child strong{color:var(--green)}
.slide:nth-of-type(3){background:var(--yellow);color:var(--blue)}
.slide:nth-of-type(4){background:var(--red);color:var(--white)}
.controls{background:var(--white);color:var(--blue);padding:16px;border-radius:var(--radius)}

#next:enabled{color:var(--green)}
#next:hover:enabled{color:var(--red)}

@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<main class="deck" aria-label="VocalCoach product findings deck">
<section class="slide active" aria-label="Slide 1 of 4: VocalCoach">

 <div class="composition"><div class="main"><h1>Practise with a voice coach</h1></div></div>

</section>
<section class="slide" aria-label="Slide 2 of 4: Two tasks per word">

 <div class="composition"><div class="main"><h2>Two tasks per word</h2><div class="list"><div class="item"><span class="num">01</span><div><strong>Recall the word</strong></div></div><div class="item"><span class="num">02</span><div><strong>Use it in a sentence</strong></div></div><div class="item"><span class="num">03</span><div><strong>Review missed words</strong></div></div></div></div></div>

</section>
<section class="slide" aria-label="Slide 3 of 4: iOS navigation">

 <div class="composition"><div class="main"><h2>iOS navigation</h2><div class="tabs"><span>Today</span><span>Words</span><br><span>Alarm</span><span>Settings</span></div></div></div>

</section>
<section class="slide" aria-label="Slide 4 of 4: The alarm constraint">

 <div class="composition"><div class="main"><h2>The alarm needs an open page</h2></div></div>

</section>
<nav class="controls" aria-label="Slide controls"><button id="prev" type="button" aria-label="Previous slide" disabled>&larr;</button><button id="next" type="button" aria-label="Next slide">&rarr;</button></nav>
</main>
<script>
(()=>{
 const slides=[...document.querySelectorAll('.slide')];
 const prev=document.getElementById('prev');
 const next=document.getElementById('next');
 let index=0;
 function show(i){
  index=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((slide,n)=>{
   slide.classList.toggle('active',n===index);
   slide.setAttribute('aria-hidden',String(n!==index));
  });
  prev.disabled=index===0;
  next.disabled=index===slides.length-1;
 }
 prev.onclick=()=>show(index-1);
 next.onclick=()=>show(index+1);
 document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(e.key))e.preventDefault();
  if(e.key==='ArrowRight'||e.key==='PageDown')show(index+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')show(index-1);
  if(e.key==='Home')show(0);
  if(e.key==='End')show(slides.length-1);
 });
 show(0);
})();
</script>
</body>
</html>
